<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
    :root {
        --deep-navy: #0a192f;
        --cyber-red: #e74c3c;
        --steel-blue: #2c3e50;
        --text-light: #e6f1ff;
    }

    body {
        background: radial-gradient(circle at center, #112240 0%, var(--deep-navy) 100%);
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Segoe UI', sans-serif;
        margin: 0;
        overflow: hidden;
    }

    .login-card {
        width: 100%;
        max-width: 400px;
        background: rgba(17, 34, 64, 0.8);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(231, 76, 60, 0.3);
        border-radius: 15px;
        padding: 40px;
        box-shadow: 0 0 30px rgba(0, 0, 0, 0.5), inset 0 0 10px rgba(231, 76, 60, 0.1);
        position: relative;
    }

    /* Petit effet de scanner en haut de la carte */
    .login-card::before {
        content: "";
        position: absolute;
        top: 0; left: 0; width: 100%; height: 2px;
        background: var(--cyber-red);
        box-shadow: 0 0 15px var(--cyber-red);
        animation: scanline 3s infinite linear;
    }

    @keyframes scanline {
        0% { top: 0; opacity: 0; }
        50% { opacity: 1; }
        100% { top: 100%; opacity: 0; }
    }

    .cyber-title {
        color: var(--text-light);
        text-transform: uppercase;
        letter-spacing: 3px;
        font-weight: 800;
        margin-bottom: 30px;
        text-align: center;
    }

    .cyber-title span { color: var(--cyber-red); }

    .form-control {
        background: rgba(10, 25, 47, 0.7);
        border: 1px solid var(--steel-blue);
        color: white !important;
        padding: 12px;
        margin-bottom: 20px;
    }

    .form-control:focus {
        background: rgba(10, 25, 47, 0.9);
        border-color: var(--cyber-red);
        box-shadow: 0 0 10px rgba(231, 76, 60, 0.3);
    }

    .btn-cyber {
        background: var(--cyber-red);
        color: white;
        width: 100%;
        padding: 12px;
        font-weight: bold;
        text-transform: uppercase;
        border: none;
        transition: 0.3s;
        letter-spacing: 1px;
    }

    .btn-cyber:hover {
        background: #c0392b;
        box-shadow: 0 0 20px rgba(231, 76, 60, 0.5);
        transform: translateY(-2px);
    }

    .error-msg {
        background: rgba(231, 76, 60, 0.1);
        border-left: 4px solid var(--cyber-red);
        color: var(--cyber-red);
        padding: 10px;
        font-size: 0.9rem;
        margin-bottom: 20px;
    }

    .footer-links {
        text-align: center;
        margin-top: 25px;
    }

    .footer-links a {
        color: rgba(230, 241, 255, 0.6);
        text-decoration: none;
        font-size: 0.85rem;
        transition: 0.3s;
    }

    .footer-links a:hover { color: var(--cyber-red); }
</style>

<div class="login-card">
    <div class="cyber-title">
        <i class="fas fa-terminal"></i> Core<span>Auth</span>
    </div>

    {% if error %}
    <div class="error-msg">
        <i class="fas fa-exclamation-triangle"></i> {{ error }}
    </div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        <div class="input-group mb-3">
            <span class="input-group-text bg-transparent border-end-0 text-muted">
                <i class="fas fa-user-shield"></i>
            </span>
            <input type="text" name="username" class="form-control border-start-0" placeholder="Utilisateur" required>
        </div>

        <div class="input-group mb-4">
            <span class="input-group-text bg-transparent border-end-0 text-muted">
                <i class="fas fa-lock"></i>
            </span>
            <input type="password" name="password" class="form-control border-start-0" placeholder="Clé d'accès" required>
        </div>

        <button type="submit" class="btn btn-cyber">
            Authentification <i class="fas fa-sign-in-alt ms-2"></i>
        </button>
    </form>

    <div class="footer-links">
        <a href="{% url 'signup' %}">Pas encore d'accès ? <span style="color:var(--cyber-red)">Créer un profil</span></a>
    </div>
</div>
