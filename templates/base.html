<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CyberLink & SOC Platform{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
<style>
/* =========================
   GLOBAL SOC DARK THEME
========================= */

body {
    background: radial-gradient(circle at top, #0b1220 0%, #050814 100%);
    color: #e5e7eb;
    font-family: 'Segoe UI', system-ui, sans-serif;
}

/* =========================
   FORCE VISIBILITY TEXT
========================= */

h1, h2, h3, h4, h5, h6, p, span, td, th, label {
    color: #e5e7eb !important;
}

.text-muted {
    color: #9ca3af !important;
}

small {
    color: #94a3b8 !important;
}

/* =========================
   CARDS
========================= */

.card, .cyber-card {
    background: rgba(15, 23, 42, 0.85);
    border: 1px solid rgba(56, 189, 248, 0.15);
    border-radius: 14px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    backdrop-filter: blur(10px);
}

/* =========================
   NAVBAR
========================= */

.navbar {
    background: rgba(2, 6, 23, 0.95) !important;
    border-bottom: 1px solid rgba(56, 189, 248, 0.2);
}

/* =========================
   TABLE FIX (IMPORTANT)
========================= */

.table {
    color: #e5e7eb !important;
}

.table-dark {
    --bs-table-bg: transparent !important;
    --bs-table-color: #e5e7eb !important;
}

.table thead th {
    background-color: rgba(15, 23, 42, 0.95) !important;
    color: #38bdf8 !important;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    border-bottom: 1px solid rgba(56, 189, 248, 0.2);
}

/* =========================
   FORMS
========================= */

.form-control, .form-select {
    background-color: rgba(2, 6, 23, 0.8) !important;
    border: 1px solid rgba(56, 189, 248, 0.2) !important;
    color: #e5e7eb !important;
}

.form-control::placeholder {
    color: #6b7280 !important;
}

/* =========================
   BUTTONS
========================= */

.btn-info {
    background: linear-gradient(135deg, #0ea5e9, #2563eb);
    border: none;
    color: white;
}

.btn-danger {
    background: linear-gradient(135deg, #ef4444, #991b1b);
    border: none;
}

/* =========================
   BADGES
========================= */

.badge {
    font-size: 0.75rem;
    letter-spacing: 0.5px;
}

/* =========================
   CODE (IP / URL)
========================= */

code {
    color: #38bdf8 !important;
    background-color: rgba(56, 189, 248, 0.1);
    padding: 3px 6px;
    border-radius: 6px;
}

/* =========================
   HOVER FIX
========================= */

tr:hover {
    background-color: rgba(56, 189, 248, 0.05) !important;
}

/* =========================
   MODAL VISIBILITY FIX
========================= */

#incidentModal {
    color: #e5e7eb;
}

#incidentModal .bg-dark {
    background-color: #0b1220 !important;
}

.glow {
    text-shadow: 0 0 8px rgba(56,189,248,0.4);
}
#incidentModal .bg-dark {
    animation: pop 0.2s ease-in-out;
}

@keyframes pop {
    from { transform: scale(0.95); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}

.bg-dark {
    color: #ffffff !important;
}

.tab-pane {
    color: #ffffff;
}

ul {
    word-break: break-word;
}
</style>
</head>
<body>

    {% block content %}
    {% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
